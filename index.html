<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>간이 채팅</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root { --me: #0a84ff; --other: #e9e9eb; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, sans-serif; height: 100dvh; display: flex; flex-direction: column; }
  #usage { font: 12px/1.4 ui-monospace, monospace; padding: 6px 12px; background: #f5f5f7; border-bottom: 1px solid #ddd; }
  #usage .bar { height: 4px; background: #ddd; margin-top: 4px; border-radius: 2px; }
  #usage .bar > div { height: 100%; background: var(--me); border-radius: 2px; }
  #login, #chat { flex: 1; display: flex; flex-direction: column; }
  #login { justify-content: center; align-items: center; gap: 10px; padding: 20px; }
  #login input { width: 260px; padding: 10px; font-size: 16px; }
  button { padding: 10px 16px; font-size: 15px; cursor: pointer; }
  #header { display: flex; justify-content: space-between; padding: 8px 12px; border-bottom: 1px solid #ddd; }
  #msgs { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
  .row { display: flex; flex-direction: column; max-width: 75%; }
  .row.me { align-self: flex-end; align-items: flex-end; }
  .row.other { align-self: flex-start; }
  .name { font-size: 12px; color: #888; margin-bottom: 2px; }
  .bubble { padding: 8px 12px; border-radius: 16px; background: var(--other); word-break: break-word; white-space: pre-wrap; }
  .me .bubble { background: var(--me); color: #fff; }
  .bubble img { max-width: 240px; border-radius: 12px; display: block; }
  .time { font-size: 11px; color: #999; margin-top: 2px; }
  #inputbar { display: flex; gap: 8px; padding: 8px; border-top: 1px solid #ddd; align-items: center; padding-bottom: calc(8px + env(safe-area-inset-bottom)); }
  #text { flex: 1; padding: 8px; font-size: 16px; border: 1px solid #ccc; border-radius: 18px; resize: none; }
  #err { color: #c00; font-size: 13px; padding: 0 12px; }
</style>
</head>
<body>
<div id="usage">사용량 불러오는 중…<div class="bar"><div id="dbbar" style="width:0"></div></div></div>

<div id="login">
  <h3>간이 채팅</h3>
  <input id="name" placeholder="이름" autocapitalize="none" autocomplete="username">
  <input id="pin" type="password" placeholder="PIN" autocomplete="current-password">
  <button id="loginBtn">입장</button>
  <small>처음 쓰는 이름이면 자동 가입돼요</small>
  <div id="loginErr" id="err"></div>
</div>

<div id="chat" hidden>
  <div id="header"><b id="me"></b><button id="logout">로그아웃</button></div>
  <div id="msgs"></div>
  <div id="err"></div>
  <div id="inputbar">
    <label style="cursor:pointer;font-size:22px">📷<input id="photo" type="file" accept="image/*" hidden></label>
    <textarea id="text" rows="1" placeholder="메시지"></textarea>
    <button id="send">▲</button>
  </div>
</div>

<script>
const CFG = {
  url: "https://lfizodadhdyglispqrxu.supabase.co",
  anonKey: "sb_publishable_j3x4wvXZNxMAhHt_kSl22A_U1WkV-x4",
  bucket: "chat-images",
  dbLimitMB: 500,
  storageLimitMB: 1024,
};
const sb = supabase.createClient(CFG.url, CFG.anonKey);
const $ = id => document.getElementById(id);
let me = JSON.parse(localStorage.getItem("me") || "null");
let lastId = 0;
let seen = new Set();
let pageActive = true;

document.addEventListener("visibilitychange", () => pageActive = !document.hidden);

// 알림 권한
async function askNotify() {
  if ("Notification" in window && Notification.permission === "default") {
    try { await Notification.requestPermission(); } catch (_) {}
  }
}
function notify(m) {
  if (!("Notification" in window) || Notification.permission !== "granted" || pageActive) return;
  new Notification(m.user_name, { body: m.body ?? "📷 사진을 보냈습니다" });
}

// 로그인 (PIN 해시는 SHA-256)
async function sha256(s) {
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s));
  return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, "0")).join("");
}
$("loginBtn").onclick = async () => {
  $("loginErr").textContent = "";
  const name = $("name").value.trim();
  const pin = $("pin").value;
  if (!name || !pin) return;
  const hash = await sha256(name.toLowerCase() + ":" + pin);
  const { data, error } = await sb.rpc("chat_login", { p_name: name, p_pin: hash });
  if (error) { $("loginErr").textContent = error.message; return; }
  me = data;
  localStorage.setItem("me", JSON.stringify(me));
  askNotify();
  enterChat();
};
$("logout").onclick = () => {
  localStorage.removeItem("me");
  location.reload();
};

function enterChat() {
  $("login").hidden = true;
  $("chat").hidden = false;
  $("me").textContent = me.name;
  loadInitial();
}

// 메시지 렌더링
function render(m, append = true) {
  if (seen.has(m.id)) return;
  seen.add(m.id);
  const mine = m.user_id === me.id;
  const row = document.createElement("div");
  row.className = "row " + (mine ? "me" : "other");
  let html = "";
  if (!mine) html += `<div class="name">${escapeHtml(m.user_name)}</div>`;
  if (m.image_path) {
    const url = `${CFG.url}/storage/v1/object/public/${CFG.bucket}/${m.image_path}`;
    html += `<div class="bubble"><img src="${url}" loading="lazy"></div>`;
  } else {
    html += `<div class="bubble">${escapeHtml(m.body ?? "")}</div>`;
  }
  html += `<div class="time">${new Date(m.created_at).toLocaleTimeString("ko-KR", { hour: "2-digit", minute: "2-digit" })}</div>`;
  row.innerHTML = html;
  const box = $("msgs");
  append ? box.appendChild(row) : box.prepend(row);
  if (m.id > lastId) lastId = m.id;
}
function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function scrollBottom() { const b = $("msgs"); b.scrollTop = b.scrollHeight; }

async function loadInitial() {
  $("msgs").innerHTML = "";
  seen = new Set(); lastId = 0;
  const { data, error } = await sb.from("messages").select("*").order("id", { ascending: false }).limit(100);
  if (error) { $("err").textContent = error.message; return; }
  data.reverse().forEach(m => render(m));
  scrollBottom();
  poll();
}

// 3초마다 새 메시지 확인
async function poll() {
  while (me) {
    const { data, error } = await sb.from("messages").select("*").gt("id", lastId).order("id", { ascending: true });
    if (!error && data.length) {
      data.forEach(m => {
        const isNew = !seen.has(m.id);
        render(m);
        if (isNew && m.user_id !== me.id) notify(m);
      });
      scrollBottom();
    }
    await new Promise(r => setTimeout(r, 3000));
  }
}

// 사용량
async function refreshUsage() {
  const { data, error } = await sb.rpc("get_usage");
  if (error || !data) return;
  const mb = b => (b / 1048576).toFixed(1);
  $("usage").firstChild.textContent =
    `DB ${mb(data.db_bytes)} / ${CFG.dbLimitMB} MB  ·  채팅 ${mb(data.chat_bytes)} MB  ·  파일 ${mb(data.storage_bytes)} / ${CFG.storageLimitMB} MB`;
  $("dbbar").style.width = Math.min(data.db_bytes / 1048576 / CFG.dbLimitMB * 100, 100) + "%";
}
setInterval(refreshUsage, 15000);
refreshUsage();

// 텍스트 전송
async function sendText() {
  const t = $("text").value.trim();
  if (!t) return;
  $("text").value = "";
  const { error } = await sb.from("messages").insert({ user_id: me.id, user_name: me.name, body: t });
  if (error) $("err").textContent = error.message;
  else $("err").textContent = "";
}
$("send").onclick = sendText;
$("text").addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendText(); }
});

// 이미지 압축 (약 2MP, JPEG 0.7) 후 전송
function compress(file) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const maxPx = 2_000_000;
      const r = Math.min(1, Math.sqrt(maxPx / (img.width * img.height)));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * r);
      c.height = Math.round(img.height * r);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      c.toBlob(b => b ? resolve(b) : reject(new Error("압축 실패")), "image/jpeg", 0.7);
      URL.revokeObjectURL(img.src);
    };
    img.onerror = () => reject(new Error("이미지를 읽을 수 없습니다"));
    img.src = URL.createObjectURL(file);
  });
}
$("photo").onchange = async e => {
  const file = e.target.files[0];
  e.target.value = "";
  if (!file) return;
  try {
    $("err").textContent = "업로드 중…";
    const blob = await compress(file);
    const path = `${crypto.randomUUID()}.jpg`;
    const { error: upErr } = await sb.storage.from(CFG.bucket).upload(path, blob, { contentType: "image/jpeg" });
    if (upErr) throw upErr;
    const { error } = await sb.from("messages").insert({ user_id: me.id, user_name: me.name, image_path: path });
    if (error) throw error;
    $("err").textContent = "";
    refreshUsage();
  } catch (err) {
    $("err").textContent = err.message;
  }
};

if (me) enterChat();
</script>
</body>
</html>
